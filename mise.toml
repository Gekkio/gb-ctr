[tools]
typst = "0.15.1"

[tasks.build]
run = 'typst compile $(mise run -q inputs) gbctr.typ'

[tasks.watch]
run = 'typst watch --open xdg-open $(mise run -q inputs) gbctr.typ'

# Prints the typst --input flags for the current build. Set GBCTR_DRAFT=false for a release build.
[tasks.inputs]
hide = true
run = '''
draft=${GBCTR_DRAFT:-true}
if [ "$draft" = "true" ]; then
  revision="$(git symbolic-ref --short HEAD 2> /dev/null || echo unknown)-$(git rev-list --count HEAD)[$(git rev-parse --short HEAD)]"
else
  revision=$(git rev-list --count main)
fi
echo "--input draft=$draft --input revision=$revision"
'''
