name: ci
on:
  - push

permissions: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the revision number is a commit count
          persist-credentials: false
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-anonymous-pro fonts-noto-core
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install Font Awesome
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -L "https://github.com/FortAwesome/Font-Awesome/releases/download/${FONTAWESOME_VERSION}/fontawesome-free-${FONTAWESOME_VERSION}-desktop.zip" -o fontawesome.zip
          unzip -j fontawesome.zip "fontawesome-free-${FONTAWESOME_VERSION}-desktop/otfs/"'*' -d "$HOME/.local/share/fonts"
          fc-cache
        env:
          FONTAWESOME_VERSION: 7.3.1
      - run: mise run build
        env:
          GBCTR_DRAFT: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      - name: Upload built PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: gbctr.pdf
          if-no-files-found: error
  deploy:
    name: Deploy PDF
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: {}
    steps:
      - name: Download built PDF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdf
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp gbctr.pdf "s3://${S3_BUCKET}/gbctr.pdf"
